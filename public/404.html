<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESAT Atlas</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e3f36; color: #e7f2ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
      a { color: #b7dc6c; }
    </style>
    <script>
      // ESAT Atlas is a single page that routes with the URL hash, so any other path is
      // sent back to the application root. On GitHub project pages the first path
      // segment is the repository name and must be preserved.
      (function () {
        var segments = window.location.pathname.split("/").filter(Boolean);
        var onProjectPage = window.location.hostname.endsWith("github.io") && segments.length > 1;
        var base = onProjectPage ? "/" + segments[0] + "/" : "/";
        window.location.replace(base);
      })();
    </script>
  </head>
  <body>
    <div>
      <p>Redirecting to ESAT Atlas…</p>
      <p><a href="/">Open ESAT Atlas</a></p>
    </div>
  </body>
</html>
